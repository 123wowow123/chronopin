<div ng-switch="$ctrl.getTimelineStatus()" class="main">

  <!-- Outside the ng-switch branches on purpose, and floating: the page opens
       scrolled to today, thousands of pixels below the top of the timeline, so
       a filter in the normal flow would never be seen. Staying put also keeps
       it clickable over the fixed page_message overlay. -->
  <div class="main__filter">
    <posted-filter within="$ctrl.postedWithin" on-change="$ctrl.setPostedWithin(within, label)"></posted-filter>
  </div>

  <div class="container-fluid main__timeline">
    <div class="row">
      <div class="col-lg-12">
        <ul class="timeline">

          <!-- Sits between the last past bag and the first future one. Kept as
               its own row so its tags anchor to it rather than to a bag. -->
          <li class="timeline__today" data-ng-repeat-start="bag in $ctrl.bags"
            ng-class="{'\--active': $ctrl.todayMarkerIndex() === $index}">
            <today-marker ng-if="$ctrl.todayMarkerIndex() === $index" date="$ctrl.now"></today-marker>
          </li>

          <!-- Extract Into Component -->
          <li id="{{bag.toISODateTimeString()}}" class="timeline__group-container" data-ng-repeat-end waypoint="$ctrl.updateInView(event)">

            <time-block bag="bag" config="$ctrl.appConfig"></time-block>

          </li>

          <!-- Every bag is in the past, so "now" belongs after all of them. -->
          <li class="timeline__today --active" ng-if="$ctrl.todayMarkerAtEnd()">
            <today-marker date="$ctrl.now"></today-marker>
          </li>
        </ul>
      </div>
    </div>

  </div>

  <div class="page_message" ng-switch-when="no filter match">
    <h3 class="text-muted">
      No pins posted in the last {{$ctrl.postedWithinPhrase()}}.
    </h3>
  </div>

  <div class="page_message" ng-switch-when="no match">
    <h3 class="text-muted">
      Oops, something went wrong. Please try again in a bit...
    </h3>
  </div>

  <div class="page_loading" ng-switch-when="loading">
    <h3 class="text-muted">
      <loader-pac></loader-pac>
      <!-- loading... -->
    </h3>
  </div>
  <scroll scroll-to-id="$ctrl.getHomeScrollId()"/>
</div>
