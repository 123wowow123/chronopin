<div ng-switch="$ctrl.getTimelineStatus()" class="main">
    <!-- The timeline's own filter, floating in the same place. Outside the
         switch so it stays put (and clickable) over the page messages. -->
    <div class="main__filter">
      <time-range-slider past-only="true" past-span="$ctrl.postedWithin" steps="$ctrl.sliderSteps"
        past-label-span="$ctrl.defaultSpan"
        on-change="$ctrl.setPostedWithin(past, pastLabel)"></time-range-slider>
    </div>

    <div class="page_message" ng-switch-when="no match">
      <h3 class="text-muted">
        No results found, please try a different search
      </h3>
    </div>

    <div class="page_message" ng-switch-when="no filter match">
      <h3 class="text-muted">
        No results posted in the last {{$ctrl.postedWithinPhrase()}}.
      </h3>
    </div>
  
    <div class="page_loading" ng-switch-when="searching">
      <h3 class="text-muted">
        <loader-pac></loader-pac>
        <!-- searching... -->
      </h3>
    </div>
  
    <div class="container-fluid main__timeline" ng-switch-default>
      <div class="row">
        <div class="col-lg-12">
          <ul class="timeline">
  
            <!-- The TODAY marker, placed exactly as on the timeline. -->
            <li class="timeline__today" data-ng-repeat-start="bag in $ctrl.bags"
              ng-class="{'\--active': $ctrl.todayMarkerIndex() === $index}">
              <today-marker ng-if="$ctrl.todayMarkerIndex() === $index" date="$ctrl.now"></today-marker>
            </li>

            <li id="{{bag.toISODateTimeString()}}" class="timeline__group-container" data-ng-repeat-end waypoint="$ctrl.updateInView(event)">
  
              <time-block bag="bag" config="$ctrl.appConfig"></time-block>
  
            </li>

            <li class="timeline__today --active" ng-if="$ctrl.todayMarkerAtEnd()">
              <today-marker date="$ctrl.now"></today-marker>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <scroll scroll-to-id="$ctrl.getHomeScrollId()"/>
  </div>
