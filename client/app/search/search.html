<div ng-switch="$ctrl.getTimelineStatus()" class="main">
    <!-- The timeline's own filter, floating in the same place. Outside the
         switch so it stays put (and clickable) over the page messages. -->
    <div class="main__filter">
      <time-range-slider past-only="true" past-span="$ctrl.postedWithin" steps="$ctrl.sliderSteps"
        past-label-span="$ctrl.defaultSpan"
        on-change="$ctrl.setPostedWithin(past, pastLabel)"></time-range-slider>

      <!-- Timeline or ranked list. Hidden for label-only searches, which
           carry no relevance score. -->
      <div class="search__sort" ng-if="$ctrl.hasRelevance()" role="group" aria-label="Sort results by">
        <span class="search__sort-label">Sort by</span>
        <button type="button" class="search__sort-option" ng-class="{'\--active': !$ctrl.isRelevanceSort()}"
          aria-pressed="{{!$ctrl.isRelevanceSort()}}" ng-click="$ctrl.setSortBy('date')">Date</button>
        <button type="button" class="search__sort-option" ng-class="{'\--active': $ctrl.isRelevanceSort()}"
          aria-pressed="{{$ctrl.isRelevanceSort()}}" ng-click="$ctrl.setSortBy('relevance')">Relevance</button>
      </div>

      <!-- Whose pins these are, when the search names one user. Shown even
           when nothing matches, so you can still follow them. -->
      <div class="search__user-card" ng-if="$ctrl.searchedUser">
        <div class="search__user">
          <span class="search__user-avatar" aria-hidden="true">{{$ctrl.searchedUser.userName.replace('@', '').charAt(0).toUpperCase()}}</span>
          <span class="search__user-name">{{$ctrl.searchedUser.userName}}</span>
        </div>
        <follow-button user-id="$ctrl.searchedUser.id" user-name="$ctrl.searchedUser.userName" show-count="true"></follow-button>
      </div>
    </div>

    <div class="page_message" ng-switch-when="no match">
      <h3 class="text-muted">
        No results found, please try a different search
      </h3>
    </div>

    <div class="page_message" ng-switch-when="no filter match">
      <h3 class="text-muted">
        No results posted in the last {{$ctrl.postedWithinPhrase()}}.
      </h3>
    </div>
  
    <div class="page_loading" ng-switch-when="searching">
      <h3 class="text-muted">
        <loader-pac></loader-pac>
        <!-- searching... -->
      </h3>
    </div>
  
    <div class="container-fluid main__timeline" ng-switch-default>
      <!-- Ranked by relevance: the same cards, best match first, no dates. -->
      <div class="row" ng-if="$ctrl.isRelevanceSort()">
        <div class="col-lg-12">
          <ul class="search__ranked">
            <li id="{{pin.id}}" class="grid --timeline" pin-tilt data-ng-repeat="pin in $ctrl.rankedPins track by pin.id">
              <pin-block pin="pin" config="$ctrl.appConfig"></pin-block>
            </li>
          </ul>
        </div>
      </div>

      <div class="row" ng-if="!$ctrl.isRelevanceSort()">
        <div class="col-lg-12">
          <ul class="timeline">
  
            <!-- The TODAY marker, placed exactly as on the timeline. -->
            <li class="timeline__today" data-ng-repeat-start="bag in $ctrl.bags"
              ng-class="{'\--active': $ctrl.todayMarkerIndex() === $index}">
              <today-marker ng-if="$ctrl.todayMarkerIndex() === $index" date="$ctrl.now"></today-marker>
            </li>

            <li id="{{bag.toISODateTimeString()}}" class="timeline__group-container" data-ng-repeat-end waypoint="$ctrl.updateInView(event)">
  
              <time-block bag="bag" config="$ctrl.appConfig"></time-block>
  
            </li>

            <li class="timeline__today --active" ng-if="$ctrl.todayMarkerAtEnd()">
              <today-marker date="$ctrl.now"></today-marker>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <scroll ng-if="!$ctrl.isRelevanceSort()" scroll-to-id="$ctrl.getHomeScrollId()"></scroll>
  </div>
