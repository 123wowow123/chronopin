<div class="preferences">
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <h1>Preferences</h1>
      </div>
      <div class="col-sm-12">
        <form class="form" name="form" ng-submit="vm.save()" novalidate>

          <div class="form-group">
            <label for="default-filter-span">Timeline filter default</label>

            <select id="default-filter-span" name="defaultFilterSpanPreference" class="form-control"
              ng-model="vm.defaultFilterSpanPreference"
              ng-options="option.within as option.label for option in vm.spanOptions">
              <option value="">No preference ({{ vm.fallbackLabel }})</option>
            </select>

            <p class="help-block">
              The span the timeline's &ldquo;posted within&rdquo; filter starts on. The timeline
              still opens showing everything &mdash; this is the window the filter applies when
              you click it.
            </p>
          </div>

          <p class="help-block" ng-show="vm.message">{{ vm.message }}</p>
          <p class="help-block" ng-show="vm.error">{{ vm.error }}</p>

          <div class="form-group">
            <button class="btn btn-lg btn-primary" type="submit">Save changes</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
