<div class="profile" ng-switch="$ctrl.loading">

  <div class="page_loading" ng-switch-when="loading">
    <h3 class="text-muted">
      <loader-pac></loader-pac>
      <!-- loading... -->
    </h3>
  </div>

  <div class="container" ng-switch-default>
    <div class="row">
      <div class="col-sm-12">
        <h1>Profile</h1>
      </div>
      <div class="col-sm-12">
        <div class="form-group profile__picture">
          <label class="control-label">Picture</label>
          <div class="profile__picture-row">
            <user-avatar class="profile__avatar" user-name="vm.user.userName" picture-url="vm.user.pictureUrl"></user-avatar>
            <div class="profile__picture-actions">
              <label class="btn btn-default" ng-class="{disabled: vm.pictureBusy}">
                <i class="fa" ng-class="vm.pictureBusy ? 'fa-spinner fa-spin' : 'fa-camera'" aria-hidden="true"></i>
                {{ vm.user.pictureUrl ? 'Change picture' : 'Upload picture' }}
                <input type="file" class="profile__picture-input" accept="image/*"
                  ng-disabled="vm.pictureBusy" profile-picture-input="vm.uploadPicture(input)" />
              </label>
              <button type="button" class="btn btn-link" ng-if="vm.user.pictureUrl" ng-disabled="vm.pictureBusy"
                ng-click="vm.removePicture()">Remove</button>
              <p class="help-block" ng-if="!vm.pictureError">Shown on your pins and comments. JPEG, PNG or GIF, up to 5 MB.</p>
              <p class="help-block text-danger" ng-if="vm.pictureError">{{ vm.pictureError }}</p>
            </div>
          </div>
        </div>

        <form class="form" name="form" ng-submit="vm.patch(form)" novalidate>

          <div class="form-group" ng-class="{ 'has-success': form.userNameNoPrefix.$valid,
                                            'has-error': form.userNameNoPrefix.$invalid }">
            <label for="userNameNoPrefix" class="control-label">User Handle</label>
            <div class="input-group"
              ng-class="{'has-error' : pinForm.userNameNoPrefix.$invalid && pinForm.userNameNoPrefix.$dirty}">
              <div class="input-group-addon">@</div>
              <input type="text" name="userNameNoPrefix" class="form-control" ng-model="vm.user.userNameNoPrefix"
                required ng-pattern="/^[a-zA-Z0-9-_]+$/" maxlength="15" ng-trim="false" readonly/>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-success': form.firstname.$valid,
                                            'has-error': form.firstname.$invalid }">
            <label>Frist Name</label>

            <input type="text" name="firstname" class="form-control" ng-model="vm.user.firstName" required />
            <p class="help-block" ng-show="form.firstname.$error.required">
              A first name is required
            </p>
          </div>

          <div class="form-group" ng-class="{ 'has-success': form.lastname.$valid,
                                            'has-error': form.lastname.$invalid }">
            <label>Last Name</label>

            <input type="text" name="lastname" class="form-control" ng-model="vm.user.lastName" required />
            <p class="help-block" ng-show="form.lastname.$error.required">
              A last name is required
            </p>
          </div>

          <div class="form-group" ng-class="{ 'has-success': form.email.$valid,
                                            'has-error': form.email.$invalid }">
            <label>Email</label>

            <input type="email" name="email" class="form-control" ng-model="vm.user.email" required mongoose-error />
            <p class="help-block" ng-show="form.email.$error.email">
              Doesn't look like a valid email.
            </p>
            <p class="help-block" ng-show="form.email.$error.required">
              What's your email address?
            </p>
            <p class="help-block" ng-show="form.email.$error.mongoose">
              {{ vm.errors.email }}
            </p>
          </div>

          <div>
            <button class="btn btn-default  btn-lg btn-register" type="submit">
              Update
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
