<span class="date-confidence" ng-if="known">
    <span class="date-confidence__pill" ng-class="'date-confidence__pill--' + key"
        title="{{meta.title}}{{reasoning ? ' — ' + reasoning : ''}}">{{meta.label}}</span>
    <span class="date-confidence__why" ng-if="showReasoning && reasoning">{{reasoning}}</span>
</span>
