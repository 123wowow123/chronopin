<div class="timeline__circle today-marker__circle"></div>

<!-- The scroll target: page load and the Today button align this tag to the
     top of the page, so the id sits on the tag rather than its row. -->
<div id="today-marker" class="timeline__date --1 today-marker__label">
    <span class="timeline__tag">TODAY</span>
</div>

<!-- The day's first specialty day; the title lists them all. -->
<div class="timeline__trivia --2 timeline__specialty" ng-if="specialtyDays.length"
    title="{{specialtyDays.join('\n')}}">
    <span class="timeline__tag" ng-bind="specialtyDays[0]"></span>
</div>
