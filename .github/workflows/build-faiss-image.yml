# Builds the search service's image on GitHub's runners (docs/deploy-azure.md),
# so the VM never installs its packages or downloads its models (~1 GB) beside
# the live site. It runs only when Docker/faiss changes: the service is not part
# of every deploy (scripts/deploy-image.sh leaves FAISS alone), and a model or
# app.py change is rolled out by hand with scripts/deploy-faiss.sh.
#
#   ghcr.io/<owner>/chronopin-faiss:<commit>
name: Build faiss image

on:
  push:
    branches: [master]
    paths:
      - 'Docker/faiss/**'
      - '.github/workflows/build-faiss-image.yml'
  workflow_dispatch:

concurrency:
  group: build-faiss-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io/123wowow123
    steps:
      - uses: actions/checkout@v7

      # Docker Hub throttles GitHub's runners (see build-image.yml): the python
      # base comes from Google's mirror.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: Docker/faiss
          build-args: PYTHON_IMAGE=mirror.gcr.io/library/python:3.11-slim
          push: true
          tags: |
            ${{ env.REGISTRY }}/chronopin-faiss:${{ github.sha }}
            ${{ env.REGISTRY }}/chronopin-faiss:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
