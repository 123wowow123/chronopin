# A small shared cache in front of the three anonymous, per-region endpoints
# the page asks for on every load (2026-10-20: weather 668, cultural-days 649,
# place 362 of 18,256 requests in 5 minutes, each queued behind a busy Node
# event loop). Caddy sends them here first and falls back to `app` when this
# container is down (Docker/Caddyfile). Only GETs that name their region in the
# URL are kept; one without (the app then reads the tz cookie) always goes on
# to the app. Cookies are never forwarded, so nothing personal can be cached.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:10m max_size=100m inactive=2d use_temp_path=off;

# Weather and place ask by ?tz= or ?lat=&lon=; cultural-days by ?year=.
map "$arg_tz$arg_lat$arg_year" $edge_skip {
	""      1;
	default 0;
}

# Resolved per request, so a deploy that recreates `app` (a new address) does
# not strand a cached lookup of the old one.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
	listen 80;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $http_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	proxy_set_header Cookie "";
	proxy_set_header Connection "";
	proxy_connect_timeout 3s;
	proxy_read_timeout 30s;

	proxy_cache edge;
	proxy_cache_key "$request_uri";
	proxy_cache_bypass $edge_skip;
	proxy_no_cache $edge_skip;
	# Concurrent first requests share one trip to the app, and an app that
	# fails or is mid-deploy is answered from the last good copy.
	proxy_cache_lock on;
	proxy_cache_lock_timeout 10s;
	proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
	proxy_cache_background_update on;
	# The app's own Cache-Control is private and for the browser: what is kept
	# here is decided below.
	proxy_ignore_headers Cache-Control Expires Set-Cookie;
	proxy_hide_header Set-Cookie;
	add_header X-Edge-Cache $upstream_cache_status always;

	set $app http://app:9000;

	# A city's current weather: the app caches it 15 minutes too.
	location = /api/weather {
		proxy_cache_valid 200 15m;
		proxy_cache_valid 204 5m;
		proxy_pass $app;
	}
	# The city a time zone names changes only when the tz database does.
	location = /api/place {
		proxy_cache_valid 200 1d;
		proxy_cache_valid 204 1h;
		proxy_pass $app;
	}
	# A year's holidays in one language: fixed once computed.
	location = /api/cultural-days {
		proxy_cache_valid 200 1h;
		proxy_pass $app;
	}
	location / {
		return 404;
	}
}
